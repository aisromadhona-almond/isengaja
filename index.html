<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#17233f">
<title>MathQuest — The Adventure of Numbers</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka:wght@500;600;700&display=swap');
:root{--navy:#17233f;--ink:#263653;--muted:#71809a;--cream:#fffaf0;--gold:#f4bd55;--coral:#f27b68;--mint:#70c7a6;--sky:#75b8e8;--purple:#9c8be8;--card:#fff;--line:#e9e6dc}
*{box-sizing:border-box}
body{margin:0;background:#f6f4ed;color:var(--ink);font-family:Nunito,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:0}
button:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.hidden{display:none!important}
.app{min-height:100vh;background:radial-gradient(circle at 90% 0,#fff1d4 0,transparent 28%),#f7f5ee}
.topbar{height:68px;padding:0 4vw;display:flex;align-items:center;justify-content:space-between;background:#fffdf8;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{font:700 24px Fredoka;color:var(--navy);cursor:pointer}.brand span{color:#e69c35}
.top-right{display:flex;gap:8px;align-items:center}
.pill{background:#fff1ce;padding:7px 12px;border-radius:99px;font-weight:900;color:#98671d;font-size:13px;display:inline-block;white-space:nowrap}
.pill.lv{background:#eeeaff;color:#5b4ab0}
.avatar{width:42px;height:42px;border-radius:50%;background:#dff2e8;display:grid;place-items:center;font-size:23px;border:2px solid #fff;box-shadow:0 2px 8px #0002}
.nav{display:flex;justify-content:center;gap:6px;padding:10px 12px;background:#fffdf8;border-bottom:1px solid var(--line);position:sticky;top:68px;z-index:19;overflow-x:auto}
.nv{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:12px;text-decoration:none;color:var(--muted);font-weight:800;font-size:14px;white-space:nowrap}
.nv small{font-size:14px}.nv.on{background:var(--navy);color:#fff}
.shell{max-width:1120px;margin:auto;padding:26px 20px 70px}
.page{animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 #f4bd5599}100%{box-shadow:0 0 0 16px #f4bd5500}}
.bob{animation:bob 2.4s ease-in-out infinite;display:inline-block}
.shake{animation:shake .3s}
.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:900;color:#d99b36}
.muted{color:var(--muted);font-size:13px}
.hero{background:var(--navy);color:#fff;border-radius:26px;padding:34px 38px;position:relative;overflow:hidden;display:grid;grid-template-columns:1.25fr .75fr;gap:20px;min-height:250px;box-shadow:0 14px 35px #1b2a4820}
.hero:after{content:"✦";position:absolute;font-size:240px;color:#ffffff0c;right:5%;top:-65px}
.hero h1{font:700 clamp(30px,5vw,48px)/1.08 Fredoka;margin:12px 0}
.hero p{color:#d3dcec;max-width:520px;line-height:1.7;margin:0 0 20px}
.hero-art{font-size:110px;display:grid;place-items:center;z-index:1;filter:drop-shadow(0 12px 7px #0003)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}.row.between{justify-content:space-between}.row.center{justify-content:center}.row.wrap{flex-wrap:wrap}
.btn{padding:12px 20px;border-radius:13px;font-weight:900;transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{transform:translateY(-2px)}
.primary{background:var(--gold);color:#3c2c16;box-shadow:0 4px 0 #d99b36}
.secondary{background:#edf1f7;color:var(--navy)}
.ghost{background:#ffffff22;color:#fff}
.danger{background:#fde4df;color:#a4493d}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px;display:flex;gap:12px;align-items:center}
.stat-icon{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:22px;flex:none}
.stat strong{font:700 21px Fredoka;display:block}.stat small{color:var(--muted);font-weight:700}
.xpbar{height:6px;background:#eee;border-radius:9px;margin-top:5px;overflow:hidden}.xpbar i{display:block;height:100%;background:var(--purple)}
.section-head{margin:30px 0 14px}.section-head h2{font:700 25px Fredoka;margin:0;color:var(--navy)}.section-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.worlds{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.world{border-radius:22px;padding:22px;color:#fff;position:relative;overflow:hidden;min-height:215px}
.world.prob{background:linear-gradient(135deg,#347c9d,#28506f)}.world.stat{background:linear-gradient(135deg,#8065b5,#514a89)}
.world h3{font:700 25px Fredoka;margin:8px 0}.world p{max-width:300px;color:#ffffffd9;line-height:1.5;font-size:13px}
.world .we{font-size:58px;position:absolute;right:22px;top:20px;filter:drop-shadow(0 5px 3px #0002)}
.world .btn{background:#fff;color:var(--navy);margin-top:12px}
.progress{height:8px;background:#ffffff50;border-radius:99px;overflow:hidden;margin:14px 0 5px;max-width:250px}.progress span{height:100%;display:block;background:#f8c65f;border-radius:99px}
.feature-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.feature{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px;text-align:center;transition:.2s;color:var(--ink)}
.feature:hover{transform:translateY(-3px);box-shadow:0 8px 20px #1b2a4815}
.feature span{font-size:30px}.feature b{display:block;margin:8px 0 3px}.feature small{color:var(--muted)}
.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px;max-width:860px;margin:6px auto;box-shadow:0 10px 30px #1b2a480b}
.panel.wide{max-width:1000px}.panel.center{text-align:center}
.panel h2{font:700 29px Fredoka;color:var(--navy);margin:4px 0 8px}.panel h3{font:700 21px Fredoka;color:var(--navy);margin:14px 0 8px}
.panel p{line-height:1.7;color:#596982}
.back{color:#60708b;background:transparent;font-weight:900;padding:6px 0;margin-bottom:10px}
.big{font-size:70px}
.dots{display:flex;gap:6px;margin:10px 0 16px}.dots i{flex:1;height:7px;border-radius:9px;background:#e8eaf0}.dots i.on{background:var(--sky)}
.lesson-box{background:#f4f8fb;border-left:4px solid var(--sky);padding:16px 18px;border-radius:12px;margin:10px 0 16px}
.lesson-box.story{background:#fff8e8;border-color:var(--gold)}
.lesson-box p{margin:0 0 8px}.lesson-box .ex{background:#fff;border-radius:10px;padding:10px 12px;margin-top:10px}
.formula{font:700 22px Fredoka;color:#315c82;text-align:center;padding:10px}
.owl{display:flex;gap:14px;align-items:flex-start}.owl-av{font-size:50px;flex:none}
.bubble{background:#fff;border-radius:16px;padding:12px 16px;line-height:1.65;color:#4a5a73;box-shadow:0 3px 12px #0001;position:relative}
.demo{background:#fbfaf5;border:2px dashed #e5dfc9;border-radius:16px;padding:16px;margin:14px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{padding:8px 13px;border-radius:99px;background:#edf1f7;color:var(--navy);font-weight:800;font-size:13px}.chip.on{background:var(--navy);color:#fff}
.tiles-sm{display:flex;flex-wrap:wrap;gap:6px}.tiles-sm span{background:#fff;border:1px solid #dfe6f0;border-radius:9px;padding:4px 9px;font-weight:800;font-size:13px}
.sl{display:flex;align-items:center;gap:10px;margin:8px 0;font-weight:800}.sl span{width:120px;flex:none}.sl input{flex:1}.sl b{width:30px;text-align:right}
input[type=range]{accent-color:#e69c35}.wide{width:100%}
.input{padding:11px 14px;border:2px solid #e3e7ee;border-radius:12px;font:inherit;font-weight:700;width:100%;color:var(--ink);background:#fff}
.input:focus{outline:none;border-color:var(--sky)}.input.ok{border-color:var(--mint);background:#e9f8f1}.input.no{border-color:var(--coral);background:#fff0ed}
.lbl{display:block;font-weight:900;margin:14px 0 6px;font-size:13px;color:var(--muted)}
.pbars{margin:10px 0}.pb{display:grid;grid-template-columns:150px 1fr 56px;gap:10px;align-items:center;margin:6px 0;font-weight:800;font-size:13px}
.pbt{height:12px;background:#e9edf3;border-radius:9px;overflow:hidden}.pbt i{display:block;height:100%;border-radius:9px;transition:.3s}
.statline{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0;font-weight:800}
.chartbox{position:relative;height:250px;margin:12px 0;background:#fff;border-radius:14px;padding:6px}.chartbox.sm{height:200px}
.tbl{border-collapse:collapse;margin:12px auto;min-width:260px;background:#fff;border-radius:10px;overflow:hidden}
.tbl th,.tbl td{border:1px solid #e5e9f0;padding:7px 14px;text-align:center;font-weight:700}.tbl th{background:#f1f5fa}
.numline{position:relative;height:50px;margin:18px 14px;border-bottom:3px solid #cdd7e5}
.nd{position:absolute;bottom:-9px;width:16px;height:16px;border-radius:50%;background:var(--sky);transform:translateX(-50%);border:2px solid #fff}
.nd.mn{background:var(--mint)}.nd.mx{background:var(--coral)}
.question{font-weight:900;font-size:18px;color:var(--navy);margin:16px 0;line-height:1.5}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.answer{padding:14px;border:2px solid #e8eaf0;border-radius:12px;background:#fff;text-align:left;font-weight:800;color:var(--ink);transition:.15s}
.answer:hover:not(:disabled){border-color:var(--sky);background:#f3f9ff}
.answer.correct{border-color:var(--mint);background:#e9f8f1;opacity:1}.answer.wrong{border-color:var(--coral);background:#fff0ed;opacity:1}
.numrow{display:flex;gap:10px}.numrow .input{flex:1}
.feedback{margin:14px 0;padding:13px 15px;border-radius:12px;font-weight:700;line-height:1.55;animation:pop .25s}
.feedback.good{background:#e9f8f1;color:#247451}.feedback.bad{background:#fff0ed;color:#a4493d}
.stmt{border-top:1px solid var(--line);padding:6px 0}
.game-stage{background:linear-gradient(135deg,#eef7fb,#f4f0ff);border-radius:18px;padding:22px;text-align:center;margin:14px 0}
.die{font-size:84px;line-height:1.3}.bigval{font:700 46px Fredoka;color:var(--navy)}
.stars{font-size:34px;letter-spacing:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}
.card h3{font:700 19px Fredoka;margin:0 0 6px;color:var(--navy)}
.gcard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:6px}
.gcard .ge{font-size:46px}.gcard h3{margin:0;font:700 22px Fredoka;color:var(--navy)}.gcard p{margin:0;font-size:13px;color:var(--muted);line-height:1.5;flex:1}
.tag{font-size:11px;font-weight:900;padding:3px 9px;border-radius:99px;display:inline-block;width:fit-content}.tag.prob{background:#dcedf5;color:#28506f}.tag.stat{background:#ebe6fa;color:#514a89}
.level-list{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.level{border:1px solid var(--line);border-radius:15px;padding:15px;background:#fffdf9}.level.lock{opacity:.55}
.level h4{margin:0 0 5px}.level p{font-size:13px;margin:0 0 10px}.level .btn{width:100%}
/* map */
.map{position:relative;aspect-ratio:16/10;border-radius:24px;overflow:hidden;background:linear-gradient(180deg,#a9dcf2,#6fb7de);box-shadow:inset 0 0 0 4px #fff8,0 12px 30px #1b2a4820;margin-bottom:18px}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.isl{position:absolute;border-radius:48% 52% 45% 55%/55% 45% 55% 45%;box-shadow:inset 0 -12px 0 #0002}
.isl.a{left:1%;top:5%;width:46%;height:90%;background:#8fd6a3}.isl.b{right:1%;top:6%;width:48%;height:88%;background:#c8b8f0}
.deco{position:absolute;font-size:clamp(18px,3vw,34px);opacity:.9;pointer-events:none}
.node{position:absolute;transform:translate(-50%,-50%);width:clamp(42px,7vw,66px);height:clamp(42px,7vw,66px);border-radius:50%;background:#fff;border:4px solid #cdd5e2;display:grid;place-items:center;font-size:clamp(18px,3vw,28px);box-shadow:0 5px 0 #0002;z-index:3;transition:.2s;padding:0}
.node:hover:not(.lock){transform:translate(-50%,-55%) scale(1.06)}
.node.cur{border-color:var(--gold);animation:pulse 1.4s infinite;background:#fff8e0}.node.done{border-color:var(--mint);background:#e9f8f1}.node.lock{filter:grayscale(1);opacity:.75;background:#e9edf3}
.node .nl{position:absolute;top:100%;margin-top:4px;font-size:clamp(9px,1.4vw,12px);font-weight:900;color:var(--navy);background:#ffffffe6;border-radius:8px;padding:2px 7px;white-space:nowrap}
.node .ns{position:absolute;top:-10px;font-size:11px;background:#fff;border-radius:99px;padding:0 5px}
.token{position:absolute;transform:translate(-50%,-135%);font-size:clamp(24px,4vw,40px);z-index:4;transition:left 1s ease,top 1s ease;filter:drop-shadow(0 4px 3px #0004)}
/* games */
.tiles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.tile{min-width:54px;height:54px;border-radius:14px;background:#fff;border:2px solid #dbe3ef;font:700 22px Fredoka;color:var(--navy);box-shadow:0 4px 0 #dbe3ef}
.tile:hover{border-color:var(--sky)}.tile.sorted{background:#e9f8f1;border-color:var(--mint);box-shadow:0 4px 0 #bfe5d3;cursor:default}
.wheelwrap{position:relative;width:min(320px,100%);margin:10px auto}
#wheel{width:100%;display:block;transition:transform 4s cubic-bezier(.12,.7,.1,1);border-radius:50%;box-shadow:0 8px 22px #0003}
.pointer{position:absolute;left:50%;top:-12px;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:28px solid var(--navy);z-index:2;filter:drop-shadow(0 2px 2px #0004)}
.hearts{font-size:22px;letter-spacing:2px}
.hpbar{height:16px;background:#e7e9f0;border-radius:99px;overflow:hidden;margin:6px 0}.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#f27b68,#f4bd55);transition:width .4s}
.timer{height:10px;background:#e7e9f0;border-radius:99px;overflow:hidden;margin:10px 0}.timer i{display:block;height:100%;background:var(--mint);transition:width .1s linear}
.monster{font-size:78px;display:inline-block}.monster.hit{animation:shake .35s}
.battlehead{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:center;text-align:center}
.board{list-style:none;margin:10px 0;padding:0}.board li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;margin:6px 0;background:#fbfaf5;border:1px solid var(--line);font-weight:800}
.board li.me{background:#fff4d6;border-color:var(--gold)}.board .rk{width:34px;font:700 20px Fredoka}.board .nm{flex:1}.board small{color:var(--muted);font-weight:700}
.ach{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;gap:12px;align-items:center}
.ach .ai{font-size:34px;width:56px;height:56px;border-radius:14px;background:#fff1ce;display:grid;place-items:center;flex:none}
.ach.lock{opacity:.5;filter:grayscale(1)}.ach b{display:block}.ach small{color:var(--muted)}
.avgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.avbtn{background:#f4f6fa;border-radius:14px;padding:8px 2px;font-size:28px;border:3px solid transparent}.avbtn small{display:block;font-size:11px;font-weight:800;color:var(--muted)}.avbtn.on{border-color:var(--gold);background:#fff8e0}
.modal{position:fixed;inset:0;background:#17233f99;z-index:50;display:grid;place-items:center;padding:16px;overflow:auto}
.modal>div{background:#fff;border-radius:22px;padding:24px;max-width:520px;width:100%;max-height:92vh;overflow:auto;animation:pop .25s}
.modal h2{font:700 26px Fredoka;margin:0 0 10px;color:var(--navy)}
#toasts{position:fixed;top:78px;right:14px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 28px)}
.toast{background:var(--navy);color:#fff;padding:12px 16px;border-radius:14px;font-weight:800;box-shadow:0 8px 22px #0004;animation:pop .25s}
.toast.ach{background:#fff4d6;color:#5a3d0b;border:2px solid var(--gold)}
.footer{text-align:center;color:#8791a3;font-size:12px;margin-top:35px}
.rpt h3{border-bottom:2px solid var(--line);padding-bottom:6px}
.score-big{font:700 64px Fredoka;color:var(--navy)}
@media(max-width:760px){
 .hero{grid-template-columns:1fr;padding:26px}.hero-art{display:none}
 .worlds,.grid2,.level-list{grid-template-columns:1fr}.grid3{grid-template-columns:1fr}
 .feature-grid{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}
 .shell{padding:18px 12px 100px}.pill{padding:6px 9px;font-size:12px}
 .nav{position:fixed;top:auto;bottom:0;left:0;right:0;justify-content:space-around;gap:0;padding:6px 4px;border-top:1px solid var(--line);border-bottom:0;box-shadow:0 -4px 14px #0001}
 .nv{flex-direction:column;gap:0;padding:5px 6px;font-size:10px}.nv small{font-size:20px}
 .map{aspect-ratio:4/5}.pb{grid-template-columns:110px 1fr 50px}
 .avgrid{grid-template-columns:repeat(3,1fr)}.answers{grid-template-columns:1fr}
 #toasts{top:74px}
}
@media print{.topbar,.nav,.noprint,.footer,#toasts{display:none!important}.panel{box-shadow:none;border:0}body{background:#fff}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
 <div class="brand" onclick="go('home')">✦ Math<span>Quest</span></div>
 <div class="top-right"><div class="pill lv">Lv <span id="chLv">1</span></div><div class="pill">⭐ <span id="chXp">0</span></div><div class="pill">🪙 <span id="chCoin">0</span></div><button class="avatar" id="avatarBtn" onclick="openProfile(false)" aria-label="Profil">🧭</button></div>
</header>

 <a class="nv" data-v="home" href="#/home"><small>🏠</small>Beranda</a>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
'use strict';
/* ============ UTIL ============ */
const KEY='mathquestSave_v2';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>b?gcd(b,a%b):a;
const frac=(n,d)=>{const g=gcd(n,d)||1;n/=g;d/=g;return d===1?String(n):n+'/'+d};
const fmt=n=>String(Math.round(n*100)/100).replace('.',',');
const sum=a=>a.reduce((x,y)=>x+y,0);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PAL=['#75b8e8','#9c8be8','#70c7a6','#f2a16f','#f27b68','#f4bd55'];
const FACE=['⚀','⚁','⚂','⚃','⚄','⚅'];
const TIMERS=new Set();
const later=(fn,ms)=>{const id=setTimeout(()=>{TIMERS.delete(id);fn()},ms);TIMERS.add(id);return id};
function parseNum(s){s=String(s).trim().replace(',','.');if(/^-?\d+(\.\d+)?\/\d+(\.\d+)?$/.test(s)){const [a,b]=s.split('/').map(Number);return a/b}return /^-?\d+(\.\d+)?$/.test(s)?Number(s):NaN}
function parseList(s){return String(s).split(/[\s,;]+/).filter(Boolean).map(x=>Number(x.replace(',','.'))).filter(Number.isFinite).slice(0,30)}
const median=a=>{const s=[...a].sort((x,y)=>x-y),n=s.length;return n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2};
function modes(a){const c={};a.forEach(v=>c[v]=(c[v]||0)+1);const mx=Math.max(...Object.values(c));return mx===1?[]:Object.keys(c).filter(k=>c[k]===mx).map(Number)}

let AC;
function sfx(t){if(S.mute)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);const f={ok:[660,880],no:[220,160],win:[523,784],tap:[440,480]}[t]||[440,440];o.frequency.setValueAtTime(f[0],AC.currentTime);o.frequency.setValueAtTime(f[1],AC.currentTime+.1);g.gain.setValueAtTime(.06,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.25);o.start();o.stop(AC.currentTime+.26)}catch(e){}}
function toast(html,cls=''){const d=document.createElement('div');d.className='toast '+cls;d.innerHTML=html;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),3600)}

/* ============ CHARTS ============ */
const charts={};
function killChart(id){if(charts[id]){charts[id].destroy();delete charts[id]}}
function killCharts(){Object.keys(charts).forEach(killChart)}
function chartCfg(c){
 const pie=c.type==='pie'||c.type==='doughnut';
 const labels=c.pct?c.labels.map((l,i)=>l+' ('+c.data[i]+'%)'):c.labels;
 const ds={label:c.title||'',data:c.data};
 if(pie){ds.backgroundColor=c.colors||PAL;ds.borderColor='#fff';ds.borderWidth=2}
 else if(c.type==='line'){ds.borderColor='#75b8e8';ds.backgroundColor='#75b8e8';ds.tension=.3;ds.pointRadius=5;ds.fill=false}
 else{ds.backgroundColor=c.data.map((_,i)=>PAL[i%PAL.length]);ds.borderRadius=8}
 return {type:c.type,data:{labels,datasets:[ds]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:pie,position:'bottom'},title:{display:!!c.title,text:c.title}},scales:pie?{}:{y:{beginAtZero:true,max:c.max,ticks:{precision:0}}}}};
}
function chartBox(id,c,cls=''){return '<div class="chartbox '+cls+'"><canvas id="'+id+'"></canvas></div>'}
function mountChart(id,c){
 const el=document.getElementById(id);if(!el)return;
 if(!window.Chart){const bx=el.parentElement;bx.style.height='auto';bx.innerHTML='<table class="tbl"><tr>'+c.labels.map(l=>'<th>'+l+'</th>').join('')+'</tr><tr>'+c.data.map(d=>'<td>'+d+(c.pct?'%':'')+'</td>').join('')+'</tr></table>';return}
 killChart(id);charts[id]=new Chart(el,chartCfg(c));
}

 return h;
}
const isRight=(q,v)=>q.type==='mc'?v===q.a:(()=>{const n=parseNum(v);return Number.isFinite(n)&&Math.abs(n-q.a)<=(q.tol||0.005)})();
const ansText=q=>q.type==='mc'?q.o[q.a]:fmt(q.a);
function lockQ(q,v,right){
 if(q.type==='mc')$$('.answer').forEach(b=>{const i=+b.dataset.i;b.disabled=true;if(i===q.a)b.classList.add('correct');else if(i===v)b.classList.add('wrong')});

}

 if(q.type==='num'&&!Number.isFinite(parseNum(v))){toast('Ketik angka dulu ya ✍️');return null}

}

const DEV=[{n:'muncul angka 6',f:x=>x===6,pr:1/6},{n:'muncul bilangan genap',f:x=>x%2===0,pr:1/2},{n:'muncul angka lebih dari 4',f:x=>x>4,pr:1/3},{n:'muncul bilangan prima',f:x=>[2,3,5].includes(x),pr:1/2},{n:'muncul kelipatan 3',f:x=>x%3===0,pr:1/3},{n:'tidak muncul angka 1',f:x=>x!==1,pr:5/6}];

let DP=null;
function diceStart(){DP={r:0,score:0,evs:shuffle(DEV).slice(0,5)};diceRound()}
function diceRound(){
 const ev=DP.evs[DP.r],N=pick([30,60,90,120]);DP.ev=ev;DP.N=N;DP.busy=false;
 render('<div class="panel"><button class="back" onclick="go(\'game/dice\')">← Keluar</button><div class="eyebrow">DICE LAB · RONDE '+(DP.r+1)+'/5 · SKOR '+DP.score+'</div><h2>Prediksi frekuensi harapan</h2><div class="game-stage"><div class="die" id="die">🎲</div><p>Dadu akan dilempar <b>'+N+' kali</b>.<br>Berapa kali kira-kira <b>'+ev.n+'</b>?</p><div class="bigval" id="pv">'+Math.round(N/2)+'</div><input type="range" id="ps" min="0" max="'+N+'" value="'+Math.round(N/2)+'" class="wide"><div class="muted" id="prog">Geser untuk memprediksi, lalu lempar!</div><br><button class="btn primary" id="rb" onclick="diceRoll()">🎲 Lempar dadu!</button></div><div id="fb"></div></div>');
 $('#ps').oninput=e=>{$('#pv').textContent=e.target.value};

function diceRoll(){
 if(DP.busy)return;DP.busy=true;sfx('tap');const pred=+$('#ps').value,N=DP.N,ev=DP.ev;$('#ps').disabled=true;$('#rb').disabled=true;S.stats.rolls+=N;
 const res=Array.from({length:N},()=>rnd(1,6));let idx=0,cnt=0;const step=Math.ceil(N/30);
 const iv=setInterval(()=>{for(let k=0;k<step&&idx<N;k++){if(ev.f(res[idx]))cnt++;idx++}
  $('#die').textContent=FACE[res[idx-1]-1];$('#prog').innerHTML='Lemparan '+idx+'/'+N+' · terjadi <b>'+cnt+'</b> kali';
  if(idx>=N){clearInterval(iv);TIMERS.delete(iv);diceDone(pred,cnt)}},70);
 TIMERS.add(iv);
}

 $('#fb').innerHTML='<div class="feedback '+(pts>=14?'good':'bad')+'">Prediksimu: <b>'+pred+'</b> · Hasil sebenarnya: <b>'+act+'</b> · Frekuensi harapan teori: <b>'+fmt(DP.ev.pr*N)+'</b><br>Poin ronde ini: <b>'+pts+'/20</b></div><button class="btn primary" onclick="diceNext()">'+(DP.r<4?'Ronde berikutnya':'Lihat skor')+' ➜</button>';
 sfx(pts>=14?'ok':'no');save();
}

/* ---- Lucky Spinner ---- */
const SPC=[{n:'Merah',c:'#f27b68'},{n:'Biru',c:'#75b8e8'},{n:'Hijau',c:'#70c7a6'},{n:'Kuning',c:'#f4bd55'},{n:'Ungu',c:'#9c8be8'}];
let SP=null;
function spStart(){SP={r:0,score:0,rot:0};spRound()}
function drawWheel(cv,slices,cols){
 const ctx=cv.getContext&&cv.getContext('2d');if(!ctx)return;const W=cv.width,R=W/2,a=Math.PI*2/slices.length;ctx.clearRect(0,0,W,W);
 slices.forEach((ci,i)=>{ctx.beginPath();ctx.moveTo(R,R);ctx.arc(R,R,R-4,-Math.PI/2+i*a,-Math.PI/2+(i+1)*a);ctx.closePath();ctx.fillStyle=cols[ci].c;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke()});
 ctx.beginPath();ctx.arc(R,R,22,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#17233f';ctx.stroke();
}
function spRound(){
 const total=pick([6,8,10,12]),nc=pick([3,4]),cols=shuffle(SPC).slice(0,nc),counts=Array(nc).fill(1);
 for(let k=0;k<total-nc;k++)counts[rnd(0,nc-1)]++;
 const slices=shuffle(counts.flatMap((c,i)=>Array(c).fill(i))),ci=rnd(0,nc-1),cnt=counts[ci],cn='<b style="color:'+cols[ci].c+'">'+cols[ci].n+'</b>';let q;
 if(SP.r%2===0){
  const correct=frac(cnt,total),cand=[frac(cnt,total-cnt),frac(total-cnt,total),frac(1,nc),frac(cnt+1,total),frac(Math.max(1,cnt-1),total)],d=[];
  cand.forEach(x=>{if(x!==correct&&!d.includes(x)&&d.length<3)d.push(x)});
  while(d.length<3){const x=frac(rnd(1,total-1),total);if(x!==correct&&!d.includes(x))d.push(x)}
  const o=shuffle([correct,...d]);
  q={type:'mc',t:'Roda ini punya '+total+' bagian sama besar. Berapa peluang jarum berhenti di warna '+cn+'?',o,a:o.indexOf(correct),e:'Ada '+cnt+' bagian '+cols[ci].n+' dari '+total+' bagian → P = '+cnt+'/'+total+' = '+correct+'.'};
 }else{
  const N=total*rnd(4,8),ans=cnt*N/total;
  q={type:'num',t:'Roda dengan '+total+' bagian sama besar ini diputar '+N+' kali. Berapa kali diperkirakan jarum berhenti di warna '+cn+'? (frekuensi harapan)',a:ans,e:'F = P × n = '+cnt+'/'+total+' × '+N+' = '+ans+' kali.'};
 }
 SP.q=q;SP.slices=slices;SP.cols=cols;SP.total=total;SP.locked=false;SP.spun=false;
 render('<div class="panel"><button class="back" onclick="go(\'game/spinner\')">← Keluar</button><div class="eyebrow">LUCKY SPINNER · RONDE '+(SP.r+1)+'/5 · SKOR '+SP.score+'</div><div class="wheelwrap"><div class="pointer"></div><canvas id="wheel" width="320" height="320" style="transform:rotate('+SP.rot+'deg)"></canvas></div><div class="chips" style="justify-content:center">'+cols.map(c=>'<span class="chip" style="background:'+c.c+'33"><span style="color:'+c.c+'">●</span> '+c.n+'</span>').join('')+'</div>'+qBody(q,'spAnswer')+'<div id="fb"></div></div>');
 drawWheel($('#wheel'),slices,cols);afterQ(q);
}
function spAnswer(v){
 if(SP.locked)return;const ok=judge(SP.q,v);if(ok===null)return;SP.locked=true;if(ok)SP.score+=20;
 $('#fb').innerHTML=fbHtml(SP.q,ok)+'<button class="btn primary" id="spb" onclick="spSpin()">🎡 Putar roda!</button><div id="spr"></div>';save();
}
function spSpin(){
 if(SP.spun)return;SP.spun=true;$('#spb').disabled=true;sfx('tap');S.stats.spins++;
 const total=SP.total,a=360/total,k=rnd(0,total-1),center=(k+.5)*a,jit=(Math.random()-.5)*a*.7,target=((360-center+jit)%360+360)%360,cur=SP.rot%360;
 SP.rot+=((target-cur)%360+360)%360+360*5;
 const w=$('#wheel');w.style.transform='rotate('+SP.rot+'deg)';
 later(()=>{const c=SP.cols[SP.slices[k]];$('#spr').innerHTML='<div class="feedback good" style="margin-top:12px">🎡 Jarum berhenti di <b style="color:'+c.c+'">'+c.n+'</b>!</div><button class="btn primary" onclick="spNext()">'+(SP.r<4?'Ronde berikutnya':'Lihat skor')+' ➜</button>';save()},4200);
}
function spNext(){if(SP.r<4){SP.r++;spRound()}else gameFinish('spinner',SP.score)}

/* ---- Data Detective ---- */
let DD=null;
function ddStart(){DD={i:0,score:0};ddCase()}
function ddCase(){
 const n=[5,7,6,7][DD.i],reps=n>=7?3:2,m=rnd(2,19);

/* ---- Chart Master ---- */
const CMT=[{t:'Buah favorit siswa',l:['Apel','Jeruk','Mangga','Pisang','Anggur'],u:'siswa'},{t:'Cara siswa berangkat ke sekolah',l:['Jalan kaki','Sepeda','Motor','Angkot','Bus'],u:'siswa'},{t:'Ekstrakurikuler pilihan siswa',l:['Basket','Futsal','Pramuka','Musik','Robotik'],u:'siswa'},{t:'Hewan peliharaan warga',l:['Kucing','Anjing','Burung','Ikan','Kelinci'],u:'keluarga'}];
let CM=null;
function cmStart(){CM={r:0,score:0};cmRound()}
function cmMake(r){
 const type=['bar','pie','table','bar','pie'][r],th=pick(CMT),labels=shuffle(th.l).slice(0,4);
 const uniq=ks=>{const mx=Math.max(...ks),mn=Math.min(...ks);return ks.filter(k=>k===mx).length===1&&ks.filter(k=>k===mn).length===1};
 let ks;do{ks=[1,1,1,1];for(let i=0;i<16;i++)ks[rnd(0,3)]++}while(!uniq(ks));
 const T=pick([20,40,60,100]),unit=T/20,counts=ks.map(k=>k*unit),mi=ks.indexOf(Math.max(...ks)),li=ks.indexOf(Math.min(...ks)),ix=rnd(0,3);
 const mcQ=(txt,ai,ex)=>({type:'mc',t:txt,o:labels,a:ai,e:ex});
 if(type==='bar'){
  const sub=pick(['most','least','diff','total']);const chart={type:'bar',title:th.t+' ('+th.u+')',labels,data:counts};let q;
  if(sub==='most')q=mcQ('Kategori mana yang paling banyak dipilih?',mi,labels[mi]+' memiliki batang tertinggi ('+counts[mi]+').');
  else if(sub==='least')q=mcQ('Kategori mana yang paling sedikit dipilih?',li,labels[li]+' memiliki batang terendah ('+counts[li]+').');
  else if(sub==='diff'){let j;do{j=rnd(0,3)}while(j===ix);q={type:'num',t:'Berapa selisih banyaknya antara '+labels[ix]+' dan '+labels[j]+'?',a:Math.abs(counts[ix]-counts[j]),e:'|'+counts[ix]+' − '+counts[j]+'| = '+Math.abs(counts[ix]-counts[j])+'.'}}
  else q={type:'num',t:'Berapa total '+th.u+' yang disurvei?',a:T,e:counts.join(' + ')+' = '+T+'.'};
  q.chart=chart;return q;
 }
 if(type==='pie'){
  const pct=ks.map(k=>k*5),chart={type:'pie',pct:true,title:th.t,labels,data:pct};let q;
  if(Math.random()<.5)q=mcQ('Kategori mana yang paling banyak dipilih?',mi,labels[mi]+' memiliki bagian terbesar ('+pct[mi]+'%).');
  else{const Tt=pick([40,60,80,100,200]);q={type:'num',t:'Jika total ada '+Tt+' '+th.u+', berapa '+th.u+' yang memilih '+labels[ix]+'?',a:pct[ix]*Tt/100,e:pct[ix]+'% × '+Tt+' = '+pct[ix]*Tt/100+'.'}}
  q.chart=chart;return q;
 }
 return {type:'num',t:'Berdasarkan tabel, berapa persen yang memilih '+labels[ix]+'?',a:ks[ix]*5,table:{labels,data:counts,total:T},e:counts[ix]+'/'+T+' × 100% = '+ks[ix]*5+'%.'};
}
function cmRound(){
 CM.q=cmMake(CM.r);CM.locked=false;
 render('<div class="panel"><button class="back" onclick="go(\'game/chart\')">← Keluar</button><div class="eyebrow">CHART MASTER · TEKA-TEKI '+(CM.r+1)+'/5 · SKOR '+CM.score+'</div><h2>Baca datanya!</h2>'+qBody(CM.q,'cmAnswer')+'<div id="fb"></div></div>');afterQ(CM.q);
}
function cmAnswer(v){
 if(CM.locked)return;const ok=judge(CM.q,v);if(ok===null)return;CM.locked=true;if(ok)CM.score+=20;
 $('#fb').innerHTML=fbHtml(CM.q,ok)+'<button class="btn primary" onclick="cmNext()">'+(CM.r<4?'Teka-teki berikutnya':'Lihat skor')+' ➜</button>';save();
}

function toggleOpt(k){keepName();S[k]=!S[k];persist();openProfile(false)}
function saveProfile(){keepName();if(!S.name)S.name='Petualang';save();closeModal();lastTok=null;route()}
function resetAll(){if(!confirm('Hapus semua progres di perangkat ini?'))return;localStorage.removeItem(KEY);load();lastTok=null;updateTop();route();openProfile(true)}

/* ============ START ============ */
load();updateTop();route();
if(!S.name)openProfile(true);
</script>
